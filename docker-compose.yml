name: email-organizer

services:
  app:
    build: { context: ., target: app }
    image: email-organizer:latest
    container_name: email-organizer
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes:
      - "${OUTPUT_DIR:-./output}:/output"
      - "${PST_DIR:-./pst}:/pst:ro"
      - "${ESTADO_DIR:-./output/.estado}:/estado"
    environment:
      EMAIL_ORGANIZER_ESTADO: /estado
      EMAIL_ORGANIZER_OUTPUT_HOST: ${OUTPUT_DIR}  # só para exibir na UI
      TZ: America/Sao_Paulo

  dev:
    build: { context: ., target: dev }
    image: email-organizer:dev
    container_name: email-organizer-dev
    profiles: [dev]
    volumes:
      - .:/app
    command: ["pytest", "-q"]
