[project]
name = "email-organizer"
version = "0.1.0"
description = "Repositório documental pessoal orientado a evidências a partir de e-mails (IMAP, Graph, PST)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{ name = "rodneyrinaldi" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "httpx>=0.27",
    "weasyprint>=66",
    "pymupdf>=1.24",
    "markdownify>=0.13",
    "msal>=1.31",
    "tnefparse>=1.4",
    "extract-msg>=0.50",
]

[project.urls]
Repository = "https://github.com/rodneyrinaldi/email-organizer"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
